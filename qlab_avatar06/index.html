<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q-LAB — Avatar 06</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
<style>
body{margin:0;background:#071a2e;color:white;font-family:Arial,sans-serif;text-align:center}
main{max-width:1000px;margin:auto;padding:24px}
model-viewer{width:100%;height:70vh;min-height:520px;background:white;border-radius:24px}

</style></head>
<body><main>
<h1>Q-LAB — Avatar 06</h1><p>Cientista com experimento vermelho</p>
<model-viewer src="avatar06.glb" alt="Cientista com experimento vermelho" camera-controls auto-rotate
ar ar-modes="webxr scene-viewer quick-look" shadow-intensity="1"
camera-orbit="0deg 75deg 3.2m">
<button slot="ar-button" style="position:absolute;left:50%;bottom:18px;transform:translateX(-50%);padding:14px 22px;border:0;border-radius:999px;font-weight:bold">VER EM RA</button>
</model-viewer>
</main></body></html>
