<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q-LAB | Átomo em Realidade Aumentada</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef4fb;font-family:Arial,sans-serif;color:#10233f}
header{background:#082c59;color:#fff;text-align:center;padding:14px}
h1{margin:0;font-size:clamp(25px,5vw,42px)}
main{max-width:1100px;margin:auto;padding:12px}
.card{background:#fff;border-radius:20px;padding:12px;box-shadow:0 8px 28px #0002}
.info{text-align:center;font-size:clamp(16px,2.5vw,21px);font-weight:700;padding:8px}
model-viewer{width:100%;height:68vh;min-height:480px;max-height:760px;background:#fff;border-radius:16px}
.ar{background:#075fc4;color:#fff;border:0;border-radius:999px;padding:15px 25px;font-size:18px;font-weight:800}
.legend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:12px;font-weight:700}
.legend span{background:#f1f6fc;border-radius:999px;padding:9px 14px}
</style>
</head>
<body>
<header><h1>Q-LAB — ÁTOMO EM REALIDADE AUMENTADA</h1></header>
<main><div class="card">
<div class="info">Gire, amplie e observe a estrutura tridimensional do átomo.</div>
<model-viewer src="atomo_Q_LAB_colorido_RA.glb"
 camera-controls touch-action="pan-y"
 camera-orbit="0deg 75deg 105%" field-of-view="24deg"
 min-field-of-view="12deg" max-field-of-view="40deg"
 shadow-intensity="1.3" exposure="1.15" environment-image="neutral"
 ar ar-scale="auto" ar-placement="floor"
 ar-modes="webxr scene-viewer quick-look">
<button class="ar" slot="ar-button">VER EM REALIDADE AUMENTADA</button>
</model-viewer>
<div class="legend">
<span>🔴 Prótons: carga positiva (+)</span>
<span>🟣 Nêutrons: carga neutra (0)</span>
<span>🔵 Elétrons: carga negativa (−)</span>
</div>
</div></main>
</body></html>
