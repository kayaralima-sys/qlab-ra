
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q-LAB | Energia de Ativação</title>
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>
  <style>
    body {
      margin: 0;
      background: #eef6ff;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #163b68;
    }
    h1 { margin: 24px 12px 8px; }
    p { padding: 0 15px; }
    model-viewer {
      width: 100%;
      height: 65vh;
      background: white;
    }
    button {
      padding: 12px 20px;
      background: #1769c2;
      color: white;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>⚛️ Q-LAB</h1>
  <h2>Energia de Ativação</h2>
  <p>Comparação entre reações com e sem catalisador</p>

  <model-viewer
    src="./comparacao.glb"
    alt="Gráficos de energia de ativação em 3D"
    camera-controls
    auto-rotate
    ar
    ar-modes="webxr scene-viewer quick-look"
    shadow-intensity="1">
    <button slot="ar-button">Visualizar em RA</button>
  </model-viewer>

  <p>O catalisador reduz a energia de ativação,
  sem alterar a energia dos reagentes e produtos.</p>
</body>
</html>
