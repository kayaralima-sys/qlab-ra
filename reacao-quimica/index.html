<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q-LAB — Reação Química</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
html,body{margin:0;min-height:100%;background:#09051b;color:#fff;font-family:Arial,sans-serif}
main{max-width:900px;margin:auto;padding:18px;text-align:center}
h1{color:#ffe34f}
p{color:#d7efff}
model-viewer{width:100%;height:70vh;min-height:480px;background:radial-gradient(circle,#202b5c,#09051b);border-radius:24px}
button{background:#7138d8;color:#fff;border:0;border-radius:999px;padding:15px 24px;font-size:17px;font-weight:700;box-shadow:0 0 18px #6b5cff}
</style>
</head>
<body>
<main>
<h1>REAÇÃO QUÍMICA</h1>
<p>CH₄ + 2 O₂ → CO₂ + 2 H₂O</p>
<model-viewer src="modelo.glb"
 alt="Modelo 3D da reação química CH4 mais 2 O2 formando CO2 mais 2 H2O"
 camera-controls auto-rotate shadow-intensity="1"
 ar ar-modes="webxr scene-viewer quick-look">
 <button slot="ar-button">VER EM REALIDADE AUMENTADA</button>
</model-viewer>
</main>
</body>
</html>
