<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q-LAB | Reação Química em RA</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:Arial,sans-serif; background:#f7fbff; color:#10233f; }
    header { padding:18px; text-align:center; background:#082c59; color:white; }
    main { max-width:1100px; margin:auto; padding:18px; }
    .card { background:white; border-radius:18px; padding:16px; box-shadow:0 8px 24px #0002; }
    model-viewer { width:100%; height:68vh; min-height:480px; background:white; border-radius:14px; }
    .equacao { text-align:center; font-size:clamp(24px,4vw,42px); font-weight:700; margin:10px 0 16px; }
    .legenda { text-align:center; margin-top:12px; font-size:16px; }
    .ar { background:#0b63ce; color:white; border:none; border-radius:999px; padding:14px 22px;
          font-size:18px; font-weight:700; }
  </style>
</head>
<body>
<header>
  <h1>Q-LAB — Reação Química</h1>
  <div>Realidade Aumentada</div>
</header>
<main>
  <div class="card">
    <div class="equacao">CH₄ + 2 O₂ → CO₂ + 2 H₂O</div>
    <model-viewer
      src="reacao_quimica_Q_LAB_RA_FINAL.glb"
      alt="Modelo tridimensional da combustão do metano: uma molécula de metano e duas de oxigênio formando uma molécula de dióxido de carbono e duas de água."
      camera-controls
      touch-action="pan-y"
      auto-rotate
      shadow-intensity="1"
      exposure="1"
      ar
      ar-modes="webxr scene-viewer quick-look">
      <button class="ar" slot="ar-button">VER EM REALIDADE AUMENTADA</button>
    </model-viewer>
    <div class="legenda">⚫ Carbono (C) &nbsp; 🔴 Oxigênio (O) &nbsp; ⚪ Hidrogênio (H)</div>
  </div>
</main>
</body>
</html>
