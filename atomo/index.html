<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q-LAB — Átomo</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;background:#fff;font-family:Arial,sans-serif}
main{height:100%;display:flex;flex-direction:column;align-items:center}
h1{font-size:22px;margin:14px 8px 4px;text-align:center}
model-viewer{width:100%;height:calc(100% - 55px);background:#fff}
button[slot="ar-button"]{background:#5b2bd5;color:white;border:0;border-radius:24px;
padding:13px 20px;font-weight:bold;position:absolute;bottom:20px;left:50%;
transform:translateX(-50%);box-shadow:0 3px 12px #999}
</style>
</head>
<body>
<main>
<h1>Q-LAB — Átomo</h1>
<model-viewer src="modelo.glb" alt="Modelo 3D de Átomo" camera-controls auto-rotate
ar ar-modes="webxr scene-viewer quick-look" shadow-intensity="1" exposure="1.15">
<button slot="ar-button">VER EM REALIDADE AUMENTADA</button>
</model-viewer>
</main>
</body>
</html>
